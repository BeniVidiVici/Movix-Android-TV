name: Générer APK Android TV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Installer les dépendances
        working-directory: app
        run: npm ci

      - name: Générer le userscript
        working-directory: app
        run: npm run build:userscript

      - name: Autoriser Gradle
        run: chmod +x app/android/gradlew

      - name: Compiler l’APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Préparer le téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Movix-Android-TV
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
